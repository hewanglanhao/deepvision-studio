<div class="mode-e-shell">
  <app-mode-e-floating-charts />

  <app-platform-topbar
    modeLabel="模式 E"
    modeTitle="反向传播沙盒"
    [statusPills]="statusPills"
    [user]="user"
    (logoutRequested)="requestLogout()"
  />

  <section class="hero-card">
    <p class="eyebrow">模式 E</p>
    <h1>反向传播 · 单步数据流可视化</h1>
    <p class="hero-desc">
      点击图中的<strong>神经元</strong>查看前向计算，切换阶段观察梯度回传与参数更新。
    </p>
  </section>

  <main class="workspace">
    <app-mode-e-control-panel />
    <app-mode-e-overview />
    <app-mode-e-detail-panel />
  </main>

  <app-teaching-search-fab />

  <app-llm-floating-assistant
    title="模式E AI 分析"
    [systemPrompt]="modeDLlmSystemPrompt"
    [contextProvider]="modeDLlmContextProvider"
    [quickPrompts]="modeDLlmQuickPrompts"
  />
</div>
