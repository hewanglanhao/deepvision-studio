<div class="control-panel">
  <!-- Preset selector -->
  <div class="ctrl-group">
    <label>预设网络</label>
    <div class="preset-list">
      @for (preset of presets(); track preset.id) {
        <button
          class="preset-btn"
          [class.selected]="preset.id === presetId()"
          (click)="selectPreset(preset.id)"
          [title]="preset.description"
        >{{ preset.name }}</button>
      }
    </div>
  </div>

  <!-- Hyperparameters -->
  <div class="ctrl-group">
    <label>学习率: <strong>{{ config().learningRate.toFixed(3) }}</strong></label>
    <input
      type="range"
      min="0.001" max="2.0" step="0.001"
      [value]="config().learningRate"
      (input)="setLr($any($event.target).value)"
      class="lr-slider"
    />
  </div>

  <div class="ctrl-group">
    <label>优化器</label>
    <div class="opt-list">
      @for (opt of optimizerOptions; track opt.value) {
        <button
          class="opt-btn"
          [class.selected]="opt.value === config().optimizer"
          (click)="setOptimizer(opt.value)"
        >{{ opt.label }}</button>
      }
    </div>
  </div>

  <div class="ctrl-group">
    <label>连续播放速度</label>
    <div class="speed-list">
      @for (sp of speedOptions; track sp.value) {
        <button
          class="speed-btn"
          [class.selected]="sp.value === playSpeed()"
          (click)="setSpeed(sp.value)"
        >{{ sp.label }}</button>
      }
    </div>
  </div>

  <!-- Current prediction status -->
  @if (state.currentStep(); as step) {
    <div class="ctrl-group">
      <label>当前状态</label>
      <div class="status-row">
        <span class="status-label">预测</span>
        <span class="status-val" [class.correct]="step.predictedClass === step.trueClass">
          {{ state.predictedClassLabel() }}
        </span>
      </div>
      <div class="status-row">
        <span class="status-label">真实</span>
        <span class="status-val">{{ state.trueClassLabel() }}</span>
      </div>
      <div class="status-row">
        <span class="status-label">损失</span>
        <span class="status-val">{{ step.loss?.toFixed(6) ?? '—' }}</span>
      </div>
    </div>
  }
</div>
