server:
  port: 8080

spring:
  datasource:
    url: ${DEEPVISION_DB_URL:jdbc:h2:file:./data/deepvision;AUTO_SERVER=TRUE}
    username: ${DEEPVISION_DB_USERNAME:sa}
    password: ${DEEPVISION_DB_PASSWORD:}
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

deepvision:
  jwt:
    secret: ${DEEPVISION_JWT_SECRET:dev-only-change-this-secret-to-at-least-32-characters}
    expiration-minutes: ${DEEPVISION_JWT_EXPIRATION_MINUTES:10080}
  uploads:
    root: ${DEEPVISION_UPLOAD_ROOT:./uploads}
  datasets:
    root: ${DEEPVISION_DATASET_ROOT:./datasets}
  forward:
    base-url: ${DEEPVISION_FORWARD_BASE_URL:http://127.0.0.1:5000}
    connect-timeout-seconds: ${DEEPVISION_FORWARD_CONNECT_TIMEOUT_SECONDS:5}
    read-timeout-seconds: ${DEEPVISION_FORWARD_READ_TIMEOUT_SECONDS:180}
  training:
    stream-base-url: ${DEEPVISION_TRAINING_STREAM_BASE_URL:ws://127.0.0.1:8080}
    jobs-root: ${DEEPVISION_TRAINING_JOBS_ROOT:./training-jobs}
    python-executable: ${DEEPVISION_TRAINING_PYTHON:C:/Users/lizihan/miniconda3/envs/dl-platform/python.exe}
    worker-script: ${DEEPVISION_TRAINING_WORKER_SCRIPT:../python-training/training_worker.py}
