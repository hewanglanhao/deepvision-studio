server:
  port: 8080

spring:
  datasource:
    url: ${DEEPVISION_DB_URL:jdbc:h2:file:./data/deepvision;AUTO_SERVER=TRUE}
    username: ${DEEPVISION_DB_USERNAME:sa}
    password: ${DEEPVISION_DB_PASSWORD:}
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

deepvision:
  jwt:
    secret: ${DEEPVISION_JWT_SECRET:dev-only-change-this-secret-to-at-least-32-characters}
    expiration-minutes: ${DEEPVISION_JWT_EXPIRATION_MINUTES:10080}
  uploads:
    root: ${DEEPVISION_UPLOAD_ROOT:./uploads}

